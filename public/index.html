<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一起听跟踪</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; max-width: 780px;
         margin: 2rem auto; padding: 0 1rem; background: #111; color: #eee; }
  h1 { font-size: 1.2rem; }
  .badge { display: inline-block; font-size: .7rem; padding: .1rem .5rem;
           border-radius: 999px; vertical-align: middle; margin-left: .35rem;
           background: #333; color: #aaa; font-weight: 400; }
  .badge.on { background: #1b4d20; color: #8ce38c; }
  .badge.off { background: #4a1a1a; color: #ff9a9a; }

  .row { margin: .6rem 0; display: flex; gap: .4rem; align-items: center; }
  input { flex: 1; padding: .5rem .7rem; font-size: 1rem;
          background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; }
  button { padding: .5rem .9rem; font-size: 1rem; background: #ff3a3a;
           color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: #333; }
  button.ghost:hover { background: #3a3a3a; }

  .card { position: relative; background: #1a1a1a; border-radius: 10px;
          padding: 1rem; margin: .9rem 0; }
  .idx { position: absolute; top: -.55rem; left: -.55rem;
         background: #ff3a3a; color: #fff; min-width: 1.5rem; height: 1.5rem;
         line-height: 1.5rem; text-align: center; border-radius: 999px;
         font-size: .75rem; font-weight: 700; padding: 0 .35rem;
         box-shadow: 0 0 0 3px #111; }

  .cover { width: 80px; height: 80px; border-radius: 8px; object-fit: cover;
           background: #333; float: left; margin-right: 1rem; }
  .meta { overflow: hidden; }
  .name { font-size: 1.05rem; font-weight: 600; margin-bottom: .2rem; }
  .artists { color: #aaa; font-size: .9rem; }

  .bar { height: 6px; background: #333; border-radius: 3px;
         margin-top: 1rem; overflow: hidden; clear: both; }
  .bar > div { height: 100%; background: #ff3a3a; width: 0;
               transition: width .2s linear; }
  .time { display: flex; justify-content: space-between;
          font-size: .85rem; color: #888; margin-top: .3rem; }

  .status { font-size: .85rem; color: #888; margin-top: .6rem;
            min-height: 1.2em; }
  .status.warn { color: #e5a52b; }

  .members { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center;
             margin-top: .7rem; padding-top: .7rem;
             border-top: 1px solid #262626; }
  .members-hint { width: 100%; font-size: .75rem; color: #555;
                  margin-bottom: .1rem; }
  .member { display: flex; align-items: center; gap: .35rem;
            font-size: .8rem; color: #aaa; background: #202020;
            border-radius: 999px; padding: .2rem .55rem .2rem .25rem; }
  .member img { width: 20px; height: 20px; border-radius: 50%;
                object-fit: cover; background: #333; }
  .member.src { color: #ffb3b3; background: #2a1a1a; }
  .member.src img { box-shadow: 0 0 0 2px #ff3a3a; }

  .hist { font-size: .9rem; color: #ccc; }
  .hist li { margin: .25rem 0; }
  .hist .ok { color: #6c6; }
  .hist .no { color: #c66; }

  .player { margin-top: .7rem; }
  .player audio { display: none; }
  .mute-btn, .sync-btn, .share-btn {
    padding: .35rem .8rem; font-size: .9rem;
  }
  .mute-btn.unmuted { background: #2e7d32; }
  .share-btn.copied { background: #2e7d32; }

  details summary { cursor: pointer; color: #888; font-size: .85rem;
                    margin-top: .5rem; }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: #2e7d32; color: #fff; padding: .5rem 1rem;
           border-radius: 6px; font-size: .9rem; opacity: 0;
           transition: opacity .25s; pointer-events: none; z-index: 9999; }
  .toast.warn { background: #b45309; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<h1>网易云一起听 · 未登录跟踪 + 播放 <span id="auth-badge" class="badge">…</span></h1>

<div class="row">
  <input id="input" placeholder="粘贴一起听分享链接，或裸 roomId">
  <button id="add">加入</button>
</div>

<div id="list"></div>
<div class="toast" id="toast"></div>

<script>
const inputEl = document.getElementById('input');
const addBtn = document.getElementById('add');
const listEl = document.getElementById('list');
const toastEl = document.getElementById('toast');
const authBadge = document.getElementById('auth-badge');

const views = new Map(); // roomId -> view
let nextIndex = 1;

function fmt(ms) {
  if (ms == null || isNaN(ms)) return '--:--';
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[c]);
}

let toastTimer = null;
function toast(msg, isWarn = false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('warn', isWarn);
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800);
}

async function copyText(text) {
  if (!text) return false;
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      return true;
    } catch {
      return false;
    }
  }
}

// ---------- 登录状态 ----------
function refreshAuthBadge() {
  fetch('/api/config').then(r => r.json()).then(cfg => {
    if (cfg.authed) {
      authBadge.textContent = '已登录 · 可播放 VIP';
      authBadge.classList.remove('off');
      authBadge.classList.add('on');
    } else {
      authBadge.textContent = '未登录 · 仅普通音质';
      authBadge.classList.remove('on');
      authBadge.classList.add('off');
    }
  }).catch(() => {
    authBadge.textContent = '状态未知';
  });
}

// ---------- WebSocket ----------
let ws = null;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let hostname;
  let port;
  if (location.hostname.includes("xslimenb.eu.org")){
    hostname = "ws.xslimenb.eu.org";
    port = 443;
  } else {
    hostname = location.hostname;
    port = 8888;
  }
  const url = `${proto}//${hostname}:${port}/ws`;
  ws = new WebSocket(url);

  ws.onopen = () => {
    for (const roomId of views.keys()) {
      ws.send(JSON.stringify({ type: 'subscribe', roomId }));
    }
  };

  ws.onmessage = (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    if (msg?.type === 'snapshot' && msg?.data?.roomId) {
      const v = views.get(msg.data.roomId);
      if (v) applySnap(v, msg.data);
    }
  };

  ws.onclose = () => {
    ws = null;
    setTimeout(connectWS, 1500);
  };
  ws.onerror = () => {};
}

function wsSubscribe(roomId) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'subscribe', roomId }));
  }
}

function wsUnsubscribe(roomId) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'unsubscribe', roomId }));
  }
}

// ---------- 列表去重 / 重排 ----------
function reindex() {
  let i = 1;
  for (const v of views.values()) {
    const el = v.refs.root.querySelector('.idx');
    if (el) el.textContent = String(i++);
  }
  nextIndex = i;
}

function removeCard(roomId) {
  const v = views.get(roomId);
  if (!v) return;
  try { v.refs.audio.pause(); } catch (_) {}
  try { v.refs.audio.removeAttribute('src'); v.refs.audio.load(); } catch (_) {}
  wsUnsubscribe(roomId);
  v.refs.root.remove();
  views.delete(roomId);
  reindex();
}

// ---------- 卡片 ----------
function createCard(roomId) {
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `
    <span class="idx">${nextIndex++}</span>
    <img class="cover" alt="">
    <div class="meta">
      <div class="name">等待第一次轮询…</div>
      <div class="artists"></div>
    </div>
    <div class="bar"><div></div></div>
    <div class="time"><span class="cur">--:--</span><span class="tot">--:--</span></div>
    <div class="members"></div>
    <div class="row player">
      <button class="mute-btn ghost" title="静音切换">🔇</button>
      <button class="sync-btn ghost" title="立刻向服务端请求最新状态">⟳ 同步</button>
      <button class="share-btn ghost" data-share="room" title="复制房间分享链接">🔗 房间链接</button>
      <button class="share-btn ghost" data-share="song" title="复制当前歌曲链接">🎵 歌曲链接</button>
      <audio preload="auto" muted></audio>
    </div>
    <div class="status"></div>
    <details>
      <summary>历史</summary>
      <ol class="hist"></ol>
    </details>
  `;
  listEl.appendChild(wrap);

  const audio = wrap.querySelector('audio');

  const v = {
    refs: {
      root: wrap,
      cover: wrap.querySelector('.cover'),
      name: wrap.querySelector('.name'),
      artists: wrap.querySelector('.artists'),
      bar: wrap.querySelector('.bar > div'),
      cur: wrap.querySelector('.cur'),
      tot: wrap.querySelector('.tot'),
      status: wrap.querySelector('.status'),
      hist: wrap.querySelector('.hist'),
      members: wrap.querySelector('.members'),
      audio,
      muteBtn: wrap.querySelector('.mute-btn'),
      syncBtn: wrap.querySelector('.sync-btn'),
      roomShareBtn: wrap.querySelector('button[data-share="room"]'),
      songShareBtn: wrap.querySelector('button[data-share="song"]'),
    },
    snap: null,
    baseProgress: 0,
    baseAt: 0,
    lastRecvAt: 0,
    currentSongId: null,
    pendingSeekMs: 0,
    urlCache: new Map(),
    switching: false,
  };

  v.refs.muteBtn.onclick = () => {
    audio.muted = !audio.muted;
    updateMuteBtn(v);
    if (audio.paused && audio.src) audio.play().catch(() => {});
  };

  v.refs.syncBtn.onclick = async () => {
    v.refs.syncBtn.disabled = true;
    try {
      await fetch(`/api/room/${encodeURIComponent(roomId)}/sync`, { method: 'POST' });
    } catch (_) {}
    v.refs.syncBtn.disabled = false;
  };

  v.refs.roomShareBtn.onclick = async () => {
    const url = v.snap?.shareUrl;
    if (!url) { toast('暂无房间链接'); return; }
    const ok = await copyText(url);
    if (ok) {
      v.refs.roomShareBtn.classList.add('copied');
      setTimeout(() => v.refs.roomShareBtn.classList.remove('copied'), 900);
      toast('房间链接已复制');
    } else {
      toast('复制失败，请手动复制', true);
    }
  };

  v.refs.songShareBtn.onclick = async () => {
    const url = v.snap?.song?.shareUrl;
    if (!url) { toast('当前无歌曲'); return; }
    const ok = await copyText(url);
    if (ok) {
      v.refs.songShareBtn.classList.add('copied');
      setTimeout(() => v.refs.songShareBtn.classList.remove('copied'), 900);
      toast('歌曲链接已复制');
    } else {
      toast('复制失败，请手动复制', true);
    }
  };

  audio.addEventListener('error', () => {
    const s = audio.getAttribute('src');
    if (!s) return;
    v.refs.status.classList.add('warn');
  });

  updateMuteBtn(v);
  return v;
}

function updateMuteBtn(v) {
  const m = v.refs.audio.muted;
  v.refs.muteBtn.textContent = m ? '🔇' : '🔊';
  v.refs.muteBtn.classList.toggle('unmuted', !m);
}

function renderProgress(v) {
  const audio = v.refs.audio;
  let prog, dur;

  if (!v.switching && audio.duration && !isNaN(audio.duration)) {
    prog = audio.currentTime * 1000;
    dur = audio.duration * 1000;
  } else if (v.snap?.song) {
    const delta = v.baseAt ? Date.now() - v.baseAt : 0;
    prog = Math.min(v.baseProgress + delta, v.snap.song.durationMs);
    dur = v.snap.song.durationMs;
  } else {
    v.refs.bar.style.width = '0%';
    v.refs.cur.textContent = '--:--';
    v.refs.tot.textContent = '--:--';
    return;
  }

  const pct = dur ? (prog / dur) * 100 : 0;
  v.refs.bar.style.width = pct.toFixed(1) + '%';
  v.refs.cur.textContent = fmt(prog);
  v.refs.tot.textContent = fmt(dur);
}

async function fetchSongUrl(v, songId) {
  if (v.urlCache.has(songId)) return v.urlCache.get(songId);
  const r = await fetch(`/api/song/${songId}/url`);
  const data = await r.json();
  const url = data.url || null;
  if (url) v.urlCache.set(songId, url);
  if (v.urlCache.size > 50) {
    const first = v.urlCache.keys().next().value;
    v.urlCache.delete(first);
  }
  return url;
}

function renderMembers(v, members) {
  const el = v.refs.members;
  if (!members || members.length === 0) {
    el.innerHTML =
      '<span style="color:#555;font-size:.8rem">等待成员信息…</span>';
    return;
  }
  el.innerHTML =
    `<div class="members-hint">当前可见成员（网易云最多返回 4 位其他人；「分享来源」仅为链接发起者，不代表房主）</div>` +
    members.map(m => `
      <span class="member${m.isInviter ? ' src' : ''}">
        <img src="${escapeHtml(m.avatar)}" alt="" referrerpolicy="no-referrer">
        <span>${escapeHtml(m.nickname)}${m.isInviter ? ' · 分享来源' : ''}</span>
      </span>
    `).join('');
}

async function syncAudio(v, snap) {
  if (!snap.song) return;
  const song = snap.song;
  const audio = v.refs.audio;

  if (v.currentSongId !== song.id) {
    v.currentSongId = song.id;
    v.pendingSeekMs = snap.progressMs;
    v.switching = true;

    try { audio.pause(); } catch (_) {}
    try {
      audio.removeAttribute('src');
      audio.load();
    } catch (_) {}

    try {
      const url = await fetchSongUrl(v, song.id);
      if (v.currentSongId !== song.id) return;

      if (!url) {
        v.switching = false;
        v.refs.status.textContent = '⚠️ 无法获取播放地址（可能无版权/VIP，可在服务端设置 MUSIC_U）';
        v.refs.status.classList.add('warn');
        return;
      }

      audio.src = url;
      audio.load();

      const onLoaded = () => {
        audio.removeEventListener('loadedmetadata', onLoaded);
        if (v.currentSongId !== song.id) return;

        if (v.pendingSeekMs > 0) {
          try { audio.currentTime = v.pendingSeekMs / 1000; } catch (_) {}
        }
        v.switching = false;
        audio.play().catch(() => {});
      };
      audio.addEventListener('loadedmetadata', onLoaded);
    } catch (e) {
      v.switching = false;
      v.refs.status.textContent = '加载失败：' + (e.message || e);
      v.refs.status.classList.add('warn');
    }
    return;
  }

  if (v.switching) return;

  if (audio.paused) {
    if (audio.src) audio.play().catch(() => {});
    return;
  }
  if (!audio.duration || isNaN(audio.duration)) return;

  const serverProgMs = snap.progressMs;
  const localMs = audio.currentTime * 1000;
  const diff = serverProgMs - localMs;
  const threshold = (snap.pollIntervalMs || 8000) * 0.8;

  if (Math.abs(diff) > threshold) {
    try { audio.currentTime = serverProgMs / 1000; } catch (_) {}
  }
}

function applySnap(v, s) {
  // 房间失效 / 未跟踪：直接从列表移除
  if (s.status === 'dead' || s.status === 'closed' ||
      s.status === 'not-tracking' || s.deadAt) {
    const reason = s.deadReason
      || (s.status === 'not-tracking' ? '服务端未跟踪' : '房间已过期');
    toast(`房间已失效：${reason}`, true);
    removeCard(s.roomId);
    return;
  }

  v.snap = s;
  v.baseProgress = s.progressMs;
  v.baseAt = Date.now();
  v.lastRecvAt = Date.now();

  if (s.song) {
    v.refs.cover.src = s.song.cover || '';
    v.refs.name.textContent = s.song.name || '(未知)';
    v.refs.artists.textContent = s.song.artists || '';
  }

  renderMembers(v, s.members);
  renderHistory(v, s.history);
  syncAudio(v, s);
  renderProgress(v);
  refreshStatus(v);
}

function renderHistory(v, history) {
  v.refs.hist.innerHTML = '';
  for (const h of (history || []).slice().reverse()) {
    const li = document.createElement('li');
    const mark = h.complete
      ? '<span class="ok">✓</span>'
      : '<span class="no">✗</span>';
    li.innerHTML =
      `${mark} ${escapeHtml(h.name)} - ${escapeHtml(h.artists)} (${h.playedSec}s / ${h.durationSec}s)`;
    v.refs.hist.appendChild(li);
  }
}

function refreshStatus(v) {
  const now = Date.now();
  const el = v.refs.status;

  if (!v.snap || !v.lastRecvAt) {
    el.textContent = '等待第一次推送…';
    el.classList.remove('warn');
    return;
  }

  const age = now - v.lastRecvAt;
  const base = v.snap.pollIntervalMs || 8000;

  if (age > base * 3) {
    el.textContent = `⚠️ 长时间未收到更新（${Math.round(age / 1000)}s），可能服务端未跟踪或网络中断`;
    el.classList.add('warn');
    return;
  }

  const last = v.snap.lastUpdatedAt
    ? new Date(v.snap.lastUpdatedAt).toLocaleTimeString()
    : '--';
  el.textContent =
    `跟踪中 · 推送间隔 ${v.snap.pollIntervalMs / 1000}s · 精度约 ±${v.snap.accuracyMs / 1000}s · 上次 ${last}`;
  el.classList.remove('warn');
}

async function add() {
  const text = inputEl.value.trim();
  if (!text) return;
  addBtn.disabled = true;
  try {
    const r = await fetch('/api/room', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ input: text }),
    });
    const s = await r.json();
    if (!r.ok) { alert(s.error || '加入失败'); return; }

    if (views.has(s.roomId)) {
      toast('该房间已在列表中');
      inputEl.value = '';
      return;
    }

    const v = createCard(s.roomId);
    views.set(s.roomId, v);
    applySnap(v, s);
    wsSubscribe(s.roomId);
    inputEl.value = '';
  } finally {
    addBtn.disabled = false;
  }
}

addBtn.onclick = add;
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') add(); });

// UI 平滑推进
setInterval(() => {
  for (const v of views.values()) renderProgress(v);
}, 200);

// 状态栏统一刷新
setInterval(() => {
  for (const v of views.values()) refreshStatus(v);
}, 500);

// 恢复已有房间
fetch('/api/rooms').then(r => r.json()).then(list => {
  for (const s of list) {
    if (views.has(s.roomId)) continue;
    if (s.status === 'dead' || s.deadAt) continue;
    const v = createCard(s.roomId);
    views.set(s.roomId, v);
    applySnap(v, s);
    wsSubscribe(s.roomId);
  }
});

// 初次检查登录状态，并每 30s 刷新一次
refreshAuthBadge();
setInterval(refreshAuthBadge, 30_000);

connectWS();
</script>
</body>
</html>
